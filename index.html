<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK Daily Challenge — Shikshit Mitra</title>
<meta name="theme-color" content="#0a1a2e">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --primary:#1a6b3c;--primary-light:#e8f5ee;--primary-dark:#145530;
  --accent:#f59e0b;--accent-light:#fffbeb;
  --green:#16a34a;--green-light:#f0fdf4;
  --red:#dc2626;--red-light:#fef2f2;
  --bg:#f8fafc;--white:#ffffff;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#f1f5f9;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.12);
  --radius:14px;--radius-sm:9px;
  --nav-h:62px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flagWave{
  0%  {background-position:0% 50%}
  25% {background-position:50% 30%}
  50% {background-position:100% 50%}
  75% {background-position:50% 70%}
  100%{background-position:0% 50%}
}
@keyframes flagWave2{
  0%  {transform:skewX(0deg) scaleY(1)}
  20% {transform:skewX(2deg) scaleY(1.02)}
  40% {transform:skewX(-2deg) scaleY(.98)}
  60% {transform:skewX(1.5deg) scaleY(1.01)}
  80% {transform:skewX(-1deg) scaleY(.99)}
  100%{transform:skewX(0deg) scaleY(1)}
}
@keyframes flagRipple{
  0%,100%{opacity:.7;transform:scaleX(1) translateX(0)}
  25%{opacity:1;transform:scaleX(1.04) translateX(-2%)}
  50%{opacity:.8;transform:scaleX(.97) translateX(2%)}
  75%{opacity:1;transform:scaleX(1.03) translateX(-1%)}
}
.loading-box{padding:28px;text-align:center;color:var(--text3);font-size:13px}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
.empty-box{padding:28px;text-align:center;color:var(--text3);font-size:13px}
@keyframes dcShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes dcFlash{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
@keyframes dcPop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.dc-shake{animation:dcShake .4s ease;}
.dc-flash-green{animation:dcFlash .35s ease;}
.dc-pop{animation:dcPop .25s ease;}
@keyframes waveMove{
  0%{transform:translateX(0) translateY(0) scaleY(1)}
  25%{transform:translateX(-8px) translateY(2px) scaleY(1.01)}
  50%{transform:translateX(-16px) translateY(0) scaleY(.99)}
  75%{transform:translateX(-8px) translateY(-2px) scaleY(1.01)}
  100%{transform:translateX(0) translateY(0) scaleY(1)}
}
@keyframes waveMove2{
  0%{transform:translateX(0) translateY(0) scaleY(1)}
  25%{transform:translateX(10px) translateY(-2px) scaleY(.99)}
  50%{transform:translateX(20px) translateY(0) scaleY(1.01)}
  75%{transform:translateX(10px) translateY(2px) scaleY(.99)}
  100%{transform:translateX(0) translateY(0) scaleY(1)}
}
@keyframes waveMove3{
  0%{transform:translateX(0) translateY(0) scaleY(1)}
  33%{transform:translateX(-10px) translateY(2px) scaleY(1.01)}
  66%{transform:translateX(10px) translateY(-2px) scaleY(.99)}
  100%{transform:translateX(0) translateY(0) scaleY(1)}
}
.wave-container{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.wave-svg{position:absolute;bottom:40%;left:-50%;width:200%;opacity:.18}
.wave-svg.w1{animation:waveMove 8s ease-in-out infinite;opacity:.10}
.wave-svg.w2{animation:waveMove2 11s ease-in-out infinite;opacity:.07;bottom:38%}
.wave-svg.w3{animation:waveMove3 14s ease-in-out infinite;opacity:.05;bottom:36%}
@media(min-width:600px){
  .wave-svg{bottom:50%}
  .wave-svg.w2{bottom:48%}
  .wave-svg.w3{bottom:46%}
}
/* Splash wave */
.splash-wave-container{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.splash-wave{position:absolute;bottom:0;left:-50%;width:200%;opacity:.12}
.splash-wave.sw1{animation:waveMove 8s ease-in-out infinite}
.splash-wave.sw2{animation:waveMove2 11s ease-in-out infinite;opacity:.08;bottom:-10px}
/* Game wave */
.game-wave-bg{position:relative;overflow:hidden}
.game-wave-bg .wave-container{z-index:0}
.game-wave-bg > *:not(.wave-container){position:relative;z-index:1}
html,body{min-height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a1a}
.gk-shell{max-width:none;margin:0;width:100%;min-height:100vh;position:relative;overflow:hidden;padding:12px 3vw;background:linear-gradient(160deg,#0a0a1a 0%,#0d1f12 40%,#0a1a2e 100%)}
.gk-shell > *:not(.wave-container){position:relative;z-index:1}

/* ── LAPTOP LAYOUT ── */
#game-menu{max-width:720px;margin:0 auto}
#dc-game-area{max-width:1000px;margin:0 auto}
/* question: larger than the answer boxes */
#dc-question-box{font-size:24px!important;line-height:1.55!important;padding:30px 34px!important;min-height:150px;display:flex;align-items:center;margin-bottom:18px!important;border-radius:18px!important}
/* options: 2 x 2 grid */
#dc-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#dc-opts button{margin-bottom:0!important;font-size:16px!important;padding:16px 18px!important;min-height:72px;border-radius:14px!important}
#dc-opts .dc-letter{width:34px!important;height:34px!important;font-size:14px!important}
#dc-timer-ring{width:70px!important;height:70px!important;font-size:26px!important}
@media(max-width:640px){
  .gk-shell{padding:12px 14px}
  #dc-question-box{font-size:16px!important;padding:16px!important;min-height:0}
  #dc-opts{grid-template-columns:1fr}
  #dc-opts button{font-size:13px!important;min-height:0;padding:12px 14px!important}
}

/* ── FULL SCREEN OVERRIDES ── */
#dc-game-area{max-width:none!important;margin:0!important;padding:0 1vw}
#dc-game-area:has(#dc-panel-review){max-width:900px!important;margin:0 auto!important}
#game-menu{max-width:820px;margin:0 auto}
#dc-timer-ring{width:66px!important;height:66px!important;font-size:24px!important;border-width:4px!important}
#dc-prog-label{font-size:clamp(14px,1.3vw,19px)!important}
.gk-ghost{position:fixed;bottom:14px;width:34px;height:34px;border-radius:50%;background:transparent;border:none;color:rgba(255,255,255,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:20;transition:color .2s}
.gk-ghost:hover{color:rgba(255,255,255,.65)}
#dc-question-box{font-size:clamp(24px,2.7vw,40px)!important;min-height:24vh;padding:clamp(28px,3.5vw,52px)!important;margin-bottom:clamp(36px,6.5vh,72px)!important}
#dc-opts{gap:clamp(16px,2.6vh,26px) clamp(16px,2vw,28px)}
#dc-opts button{font-size:clamp(17px,1.7vw,26px)!important;min-height:clamp(76px,12vh,120px);padding:18px 24px!important}
#dc-opts .dc-letter{width:44px!important;height:44px!important;font-size:18px!important}
@media(max-width:640px){
  #dc-timer-ring{width:60px!important;height:60px!important;font-size:22px!important}
  #dc-question-box{min-height:0;margin-bottom:16px!important}
  #dc-opts button{min-height:0;padding:12px 14px!important}
  #dc-opts .dc-letter{width:30px!important;height:30px!important;font-size:12px!important}
}
</style>
</head>

<script>
/* ============================================================
   DAILY CHALLENGE GAME
   ============================================================ */
var DC_SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSvboPbqXSBqbMR5UilxgOyrLvrSsxHl45mTxw6DH8DDnK1sRw_X9qIcke2Wi6zSgX4bv0gyA1hmyE-/pub?gid=0&single=true&output=csv';
var S2_URL=DC_SHEET_URL; // S2 — Daily Challenge quiz questions
var DC_STORE_KEY='dn-dc-v1';
var DC_LB_KEY='dn-dc-lb-v1';
var dcQuestions=[],dcSession={q:[],idx:0,score:0,xp:0,answers:[],startTime:0},dcTimer=null,dcTimeLeft=30;

/* ── SOUND ENGINE ── */
var dcAudioCtx=null;
var dcSoundOn=true; // default ON

function getDCAudio(){
  if(!dcAudioCtx){
    try{dcAudioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  if(dcAudioCtx&&dcAudioCtx.state==='suspended') dcAudioCtx.resume();
  return dcAudioCtx;
}

function toggleDCSound(){
  dcSoundOn=!dcSoundOn;
  var btn=document.getElementById('dc-sound-btn');
  if(!btn) return;
  if(dcSoundOn){
    btn.innerHTML=svgMicOn();
    btn.title='Sound ON';
    btn.style.color='#22c55e';
    btn.style.borderColor='rgba(34,197,94,.4)';
  } else {
    btn.innerHTML=svgMicOff();
    btn.title='Sound OFF';
    btn.style.color='rgba(255,255,255,.3)';
    btn.style.borderColor='rgba(255,255,255,.1)';
  }
  if(dcSoundOn) playDCSound('click');
}

function svgMicOn(){
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
}
function svgMicOff(){
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
}

function playDCSound(type){
  if(!dcSoundOn) return;
  var ctx=getDCAudio();if(!ctx)return;
  var t=ctx.currentTime;

  function note(freq,startT,dur,vol,waveType,detune){
    var o=ctx.createOscillator(),g=ctx.createGain();
    if(detune) o.detune.setValueAtTime(detune,startT);
    o.type=waveType||'sine';
    o.frequency.setValueAtTime(freq,startT);
    g.gain.setValueAtTime(0,startT);
    g.gain.linearRampToValueAtTime(vol,startT+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,startT+dur);
    o.connect(g);g.connect(ctx.destination);
    o.start(startT);o.stop(startT+dur);
  }

  if(type==='click'){
    note(900,t,0.06,0.18,'sine');
    return;
  }

  if(type==='correct'){
    /* Bright xylophone-style chord: root + fifth + octave, layered */
    note(523,t,0.35,0.55,'triangle');       // C5
    note(659,t+0.04,0.3,0.45,'triangle');   // E5
    note(784,t+0.08,0.28,0.4,'triangle');   // G5
    note(1047,t+0.14,0.35,0.5,'sine');      // C6 shine
    /* Subtle sparkle harmonics */
    note(1568,t+0.1,0.2,0.2,'sine');        // G6
    note(2093,t+0.18,0.15,0.15,'sine');     // C7
    return;
  }

  if(type==='wrong'){
    /* Heavy buzzer: square wave dropping pitch + low thud */
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(200,t);
    o.frequency.linearRampToValueAtTime(80,t+0.35);
    g.gain.setValueAtTime(0.55,t);
    g.gain.linearRampToValueAtTime(0.4,t+0.1);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g);g.connect(ctx.destination);
    o.start(t);o.stop(t+0.5);
    /* Low thud punch */
    note(60,t,0.25,0.6,'sine');
    note(110,t+0.05,0.2,0.35,'sawtooth');
    return;
  }

  if(type==='finish'){
    /* Victory fanfare: ascending 8-note arpeggio + final chord */
    var fanfare=[392,440,523,659,523,659,784,1047];
    fanfare.forEach(function(freq,i){
      note(freq, t+i*0.1, 0.22, 0.5, 'triangle');
    });
    /* Final chord hit */
    [523,659,784,1047].forEach(function(freq){
      note(freq, t+0.85, 0.6, 0.45, 'sine');
    });
    return;
  }

  if(type==='entry'){
    /* Cool entry music: 12-step epic rising sequence with harmony */
    var melody=[261,294,330,349,392,440,494,523,587,659,784,1047];
    var harmony=[196,220,247,261,294,330,370,392,440,494,587,784];
    melody.forEach(function(freq,i){
      note(freq,  t+i*0.07, 0.18, 0.45, 'triangle');
      note(harmony[i], t+i*0.07, 0.18, 0.25, 'sine');
    });
    /* Big finale chord */
    [523,659,784,1047,1318].forEach(function(freq,i){
      note(freq, t+0.88, 0.8, 0.4-i*0.04, 'sine');
    });
    return;
  }
}

function getDCStore(){try{return JSON.parse(localStorage.getItem(DC_STORE_KEY)||'{}')||{};}catch(e){return{};}}
function saveDCStore(obj){localStorage.setItem(DC_STORE_KEY,JSON.stringify(obj));}

function getDCStreak(){
  var s=getDCStore();
  var now=new Date();var utc=now.getTime()+(now.getTimezoneOffset()*60000);var np=new Date(utc+(5*3600+45*60)*1000);
  var today=np.toDateString();
  var yesterday=new Date(np);yesterday.setDate(np.getDate()-1);
  var streak=s.streak||0;
  if(s.lastPlayed===today) return streak;
  if(s.lastPlayed===yesterday.toDateString()) return streak; // Not reset yet, will increment on play
  if(s.lastPlayed&&s.lastPlayed!==yesterday.toDateString()&&s.lastPlayed!==today) return 0; // Missed a day
  return streak;
}

function getDCPoints(){return getDCStore().totalPoints||0;}
function getDCLevel(pts){
  if(pts>=1000) return {name:'Master',color:'#f59e0b'};
  if(pts>=500)  return {name:'Expert',color:'#a855f7'};
  if(pts>=200)  return {name:'Advanced',color:'#3b82f6'};
  if(pts>=80)   return {name:'Learner',color:'#22c55e'};
  return          {name:'Beginner',color:'rgba(255,255,255,.5)'};
}

function updateDCBadges(){
  var streak=getDCStreak();var pts=getDCPoints();var lvl=getDCLevel(pts);
  var sb=document.getElementById('dc-streak-badge');
  var lb=document.getElementById('dc-level-badge');
  if(sb) sb.innerHTML='<i class="fa-solid fa-fire" style="color:#f59e0b"></i> Streak: '+streak;
  if(lb) lb.textContent=lvl.name;
}

async function startDailyChallenge(){
  playDCSound('entry');
  document.getElementById('game-menu').style.display='none';
  var area=document.getElementById('dc-game-area');
  area.style.display='block';
  area.innerHTML='<div style="padding:40px;text-align:center"><div class="spinner" style="border-top-color:#22c55e;border-color:rgba(255,255,255,.15);margin:0 auto 12px"></div><div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.6)">Loading questions...</div></div>';
  try{
    var rows=await fetchDCSheet();
    if(!rows||rows.length<1){
      area.innerHTML='<div class="empty-box" style="margin:20px 14px"><b>0 questions loaded.</b><br><small>Sheet may still be loading or has formatting issues. Wait 10 seconds and try again.</small></div>'
        +'<button onclick="startDailyChallenge()" style="display:block;margin:8px auto;padding:9px 20px;background:var(--primary);color:#fff;border:none;border-radius:99px;font-weight:700;cursor:pointer"><i class="fa-solid fa-rotate-right"></i> Retry</button>'
        +'<button onclick="document.getElementById(\'game-menu\').style.display=\'block\';document.getElementById(\'dc-game-area\').style.display=\'none\'" style="display:block;margin:0 auto;padding:9px 20px;background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:99px;font-weight:700;cursor:pointer">← Back</button>';
      return;
    }
    // Pick 15 random questions
    var shuffled=rows.slice().sort(function(){return Math.random()-.5;});
    dcQuestions=shuffled.slice(0,Math.min(15,shuffled.length));
    dcSession={q:dcQuestions,idx:0,score:0,xp:0,answers:[]};
    renderDCQuestion();
  }catch(e){
    area.innerHTML='<div class="empty-box" style="margin:20px 14px"><b>Network error loading questions.</b><br><small>Check your internet connection and that the sheet is published as CSV (File → Share → Publish to web → CSV).</small></div>'
      +'<button onclick="startDailyChallenge()" style="display:block;margin:8px auto;padding:9px 20px;background:var(--primary);color:#fff;border:none;border-radius:99px;font-weight:700;cursor:pointer"><i class="fa-solid fa-rotate-right"></i> Retry</button>'
      +'<button onclick="document.getElementById(\'game-menu\').style.display=\'block\';document.getElementById(\'dc-game-area\').style.display=\'none\'" style="display:block;margin:0 auto;padding:9px 20px;background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:99px;font-weight:700;cursor:pointer">← Back</button>';
  }
}

function fetchDCSheet(){
  function parseToRows(csv){
    var lines=csv.trim().split('\n');
    var rows=[];
    for(var i=1;i<lines.length;i++){
      var cols=parseCSVLine(lines[i]);
      if(cols.length>=6&&cols[0].trim()){
        rows.push({q:cols[0].trim(),o:[cols[1].trim(),cols[2].trim(),cols[3].trim(),cols[4].trim()],a:cols[5].trim()});
      }
    }
    return rows;
  }
  return fetch(DC_SHEET_URL)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(csv){return parseToRows(csv);})
    .catch(function(){
      return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(DC_SHEET_URL))
        .then(function(r){return r.text();})
        .then(function(csv){return parseToRows(csv);})
        .catch(function(){
          return fetch('https://corsproxy.io/?'+encodeURIComponent(DC_SHEET_URL))
            .then(function(r){return r.text();})
            .then(function(csv){return parseToRows(csv);});
        });
    });
}

function parseCSVLine(line){
  var result=[],inQ=false,cur='';
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);
  return result;
}

function renderDCQuestion(){

  var total=dcSession.q.length;
  var num=dcSession.idx+1;

  dcSession.startTime=Date.now();
  playDCSound('click');

  var opts=q.o.map(function(o,i){return{text:o,origIdx:i};}).sort(function(){return Math.random()-.5;});
  var correctText=q.a;
  var pct=Math.round((dcSession.idx/total)*100);
  var xpLevel=getDCLevel(dcSession.xp);

  // Progress label
  var progLabel=num===total?'Final Question!'
    :num>=total-2?'Almost done — '+( total-num)+' left!'
    :'Question '+num+' of '+total;

  var svgBolt='<svg width="11" height="11" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>';

    +'<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:12px">'
    +'<div id="dc-prog-label" style="font-size:15px;font-weight:700;color:rgba(255,255,255,.6)">'+progLabel+'</div>'
    +'<div id="dc-timer-ring" style="display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;border:3px solid #22c55e;font-size:20px;font-weight:800;color:#22c55e;transition:border-color .5s,color .5s;background:rgba(34,197,94,.08)">'
    +'<span id="dc-timer-num">30</span></div>'
    +'<div></div>'
    +'</div>'
    // Question box
    +'<div id="dc-question-box" style="background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;margin-bottom:12px;font-size:13px;font-weight:700;color:#fff;line-height:1.6">'+q.q+'</div>'
    // Options
    +'<div id="dc-opts">'
    +opts.map(function(o,i){
      var letter=['A','B','C','D'][i];
      return '<button data-val="'+escQ(o.text)+'" onclick="dcAnswer(this,\''+escQ(o.text)+'\',\''+escQ(correctText)+'\')" style="display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;margin-bottom:8px;font-family:inherit;font-size:12px;font-weight:600;color:#fff;cursor:pointer;text-align:left;transition:all .2s">'
      +'<span class="dc-letter" style="width:26px;height:26px;border-radius:50%;background:rgba(34,197,94,.2);color:#86efac;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s">'+letter+'</span>'
      +'<span>'+o.text+'</span></button>';
    }).join('')
    +'</div></div>'
    +'<button class="gk-ghost" style="left:14px" onclick="dcQuit()" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>'
    +'<button class="gk-ghost" id="dc-pause-btn" style="right:14px;bottom:54px" onclick="toggleDCPause()" aria-label="Pause/Resume">'+DC_SVG_PAUSE+'</button>'
    +'<button class="gk-ghost" id="dc-pencil-btn" style="right:14px" aria-label="Edit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>';

  dcStartTick(correctText);
}

function dcStartTick(correctText){
  clearInterval(dcTimer);
  dcTimer=setInterval(function(){
    dcTimeLeft--;
    var el=document.getElementById('dc-timer-num');
    var ring=document.getElementById('dc-timer-ring');
    if(el) el.textContent=dcTimeLeft;
    if(ring){
      if(dcTimeLeft<=10){ring.style.borderColor='#ef4444';ring.style.color='#ef4444';ring.style.background='rgba(239,68,68,.1)';}
      else if(dcTimeLeft<=20){ring.style.borderColor='#f59e0b';ring.style.color='#f59e0b';ring.style.background='rgba(245,158,11,.08)';}
    }
    if(dcTimeLeft<=0){
      clearInterval(dcTimer);
      playDCSound('wrong');
      dcSession.score-=2;
      dcSession.answers.push({q:dcSession.q[dcSession.idx].q,chosen:'(Time Out)',correct:correctText,ok:false,bonus:0});
      dcTimeoutReveal(correctText);
    }
  },1000);
}

var dcPaused=false;
var DC_SVG_PAUSE='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
var DC_SVG_PLAY='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
function toggleDCPause(){
  var b=document.getElementById('dc-pause-btn'); if(!b) return;
  if(dcPaused){ dcPaused=false; b.innerHTML=DC_SVG_PAUSE; dcStartTick(dcSession.q[dcSession.idx].a); }
  else { dcPaused=true; clearInterval(dcTimer); b.innerHTML=DC_SVG_PLAY; }
}

function escQ(s){return (s||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;');}

function dcAnswer(btn,chosen,correct){
  if(dcPaused) return;
  clearInterval(dcTimer);
  var ok=(chosen.toLowerCase().trim()===correct.toLowerCase().trim());
  // Fast answer bonus: <5s = +4 pts, <10s = +2 pts, else standard
  var elapsed=(Date.now()-dcSession.startTime)/1000;
  var timeSpent=30-dcTimeLeft;
  var bonus=0;
  if(ok){
    if(timeSpent<5) bonus=4;
    else if(timeSpent<10) bonus=2;
    dcSession.score+=2+bonus;
    dcSession.xp+=10+(bonus>0?5:0);
    playDCSound('correct');
    // Green flash on question box
    var qbox=document.getElementById('dc-question-box');
    if(qbox) qbox.classList.add('dc-flash-green');
  } else {
    dcSession.score-=2;
    playDCSound('wrong');
    // Red shake on wrong button
    btn.classList.add('dc-shake');
  }
  dcSession.answers.push({q:dcSession.q[dcSession.idx].q,chosen:chosen,correct:correct,ok:ok,bonus:bonus});

  // Highlight buttons
  var opts=document.getElementById('dc-opts');
  if(opts) opts.querySelectorAll('button').forEach(function(b){
    var dataVal=b.getAttribute('data-val')||'';
    b.disabled=true;b.style.cursor='default';
    if(dataVal.toLowerCase().trim()===correct.toLowerCase().trim()){
      b.style.background='#16a34a';b.style.borderColor='#22c55e';b.style.color='#fff';
      b.querySelector('.dc-letter').style.background='rgba(255,255,255,.25)';
      b.querySelector('.dc-letter').style.color='#fff';
    } else if(b===btn&&!ok){
      b.style.background='#dc2626';b.style.borderColor='#ef4444';b.style.color='#fff';
      b.querySelector('.dc-letter').style.background='rgba(255,255,255,.25)';
      b.querySelector('.dc-letter').style.color='#fff';
    }
  });

  // Show bonus toast
  if(bonus>0){
    var area=document.getElementById('dc-game-area');
    var toast=document.createElement('div');
    toast.textContent='+'+bonus+' Speed Bonus!';
    toast.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#fff;font-size:12px;font-weight:800;padding:6px 16px;border-radius:99px;z-index:999;pointer-events:none';
    document.body.appendChild(toast);
    setTimeout(function(){toast.remove();},1200);
  }

  // Update score in UI
  var scoreEl=document.querySelector('#dc-game-area [style*="pts"]');
  if(scoreEl) scoreEl.textContent=dcSession.score+' pts';

  setTimeout(function(){dcNext();},ok?750:1000);
}

function dcTimeoutReveal(correct){
  var opts=document.getElementById('dc-opts');
  if(opts) opts.querySelectorAll('button').forEach(function(b){
    var dataVal=b.getAttribute('data-val')||'';
    b.disabled=true;b.style.cursor='default';
    if(dataVal.toLowerCase().trim()===correct.toLowerCase().trim()){
      b.style.background='#16a34a';b.style.borderColor='#22c55e';b.style.color='#fff';
      var dl=b.querySelector('.dc-letter');
      if(dl){dl.style.background='rgba(255,255,255,.25)';dl.style.color='#fff';}
    }
  });
  setTimeout(function(){dcNext();},900);
}

function dcNext(){
  dcSession.idx++;
  if(dcSession.idx>=dcSession.q.length){dcShowResult();}
  else{renderDCQuestion();}
}

function dcQuit(){
  clearInterval(dcTimer);
  dcPaused=false;
  document.getElementById('dc-game-area').style.display='none';
  document.getElementById('game-menu').style.display='block';
}

function dcShowResult(){
  clearInterval(dcTimer);
  playDCSound('finish');

  // ── Streak & store update ──
  var store=getDCStore();
  var now=new Date();var utc=now.getTime()+(now.getTimezoneOffset()*60000);var np=new Date(utc+(5*3600+45*60)*1000);
  var today=np.toDateString();
  var yesterday=new Date(np);yesterday.setDate(np.getDate()-1);
  var streak=store.streak||0;
  if(store.lastPlayed===yesterday.toDateString()) streak+=1;
  else if(store.lastPlayed===today) streak=streak;
  else streak=1;
  var totalPoints=(store.totalPoints||0)+Math.max(0,dcSession.score);
  var totalXP=(store.totalXP||0)+dcSession.xp;

}

updateDCBadges();
