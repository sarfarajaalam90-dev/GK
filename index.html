<style>
:root{
  --primary:#1a6b3c;--primary-light:#e8f5ee;--primary-dark:#145530;
  --accent:#f59e0b;--accent-light:#fffbeb;
  --green:#16a34a;--green-light:#f0fdf4;
  --red:#dc2626;--red-light:#fef2f2;
  --bg:#f8fafc;--white:#ffffff;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#f1f5f9;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.12);
  --radius:14px;--radius-sm:9px;
  --nav-h:62px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flagWave{
  0%  {background-position:0% 50%}
  25% {background-position:50% 30%}
  50% {background-position:100% 50%}
  75% {background-position:50% 70%}
  100%{background-position:0% 50%}
}
@keyframes flagWave2{
  0%  {transform:skewX(0deg) scaleY(1)}
  20% {transform:skewX(2deg) scaleY(1.02)}
  40% {transform:skewX(-2deg) scaleY(.98)}
  60% {transform:skewX(1.5deg) scaleY(1.01)}
  80% {transform:skewX(-1deg) scaleY(.99)}
  100%{transform:skewX(0deg) scaleY(1)}
}
@keyframes flagRipple{
  0%,100%{opacity:.7;transform:scaleX(1) translateX(0)}
  25%{opacity:1;transform:scaleX(1.04) translateX(-2%)}
  50%{opacity:.8;transform:scaleX(.97) translateX(2%)}
  75%{opacity:1;transform:scaleX(1.03) translateX(-1%)}
}
.loading-box{padding:28px;text-align:center;color:var(--text3);font-size:13px}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
.empty-box{padding:28px;text-align:center;color:var(--text3);font-size:13px}
@keyframes dcShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes dcFlash{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
@keyframes dcPop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.dc-shake{animation:dcShake .4s ease;}
.dc-flash-green{animation:dcFlash .35s ease;}
.dc-pop{animation:dcPop .25s ease;}
@keyframes waveMove{
  0%{transform:translateX(0) translateY(0) scaleY(1)}
  25%{transform:translateX(-8px) translateY(2px) scaleY(1.01)}
  50%{transform:translateX(-16px) translateY(0) scaleY(.99)}
  75%{transform:translateX(-8px) translateY(-2px) scaleY(1.01)}
  100%{transform:translateX(0) translateY(0) scaleY(1)}
}
@keyframes waveMove2{
  0%{transform:translateX(0) translateY(0) scaleY(1)}
  25%{transform:translateX(10px) translateY(-2px) scaleY(.99)}
  50%{transform:translateX(20px) translateY(0) scaleY(1.01)}
  75%{transform:translateX(10px) translateY(2px) scaleY(.99)}
  100%{transform:translateX(0) translateY(0) scaleY(1)}
}
@keyframes waveMove3{
  0%{transform:translateX(0) translateY(0) scaleY(1)}
  33%{transform:translateX(-10px) translateY(2px) scaleY(1.01)}
  66%{transform:translateX(10px) translateY(-2px) scaleY(.99)}
  100%{transform:translateX(0) translateY(0) scaleY(1)}
}
.wave-container{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.wave-svg{position:absolute;bottom:40%;left:-50%;width:200%;opacity:.18}
.wave-svg.w1{animation:waveMove 8s ease-in-out infinite;opacity:.10}
.wave-svg.w2{animation:waveMove2 11s ease-in-out infinite;opacity:.07;bottom:38%}
.wave-svg.w3{animation:waveMove3 14s ease-in-out infinite;opacity:.05;bottom:36%}
@media(min-width:600px){
  .wave-svg{bottom:50%}
  .wave-svg.w2{bottom:48%}
  .wave-svg.w3{bottom:46%}
}
/* Splash wave */
.splash-wave-container{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.splash-wave{position:absolute;bottom:0;left:-50%;width:200%;opacity:.12}
.splash-wave.sw1{animation:waveMove 8s ease-in-out infinite}
.splash-wave.sw2{animation:waveMove2 11s ease-in-out infinite;opacity:.08;bottom:-10px}
/* Game wave */
.game-wave-bg{position:relative;overflow:hidden}
.game-wave-bg .wave-container{z-index:0}
.game-wave-bg > *:not(.wave-container){position:relative;z-index:1}
html,body{min-height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a1a}
.gk-shell{max-width:none;margin:0;width:100%;min-height:100vh;position:relative;overflow:hidden;padding:12px 3vw;background:linear-gradient(160deg,#0a0a1a 0%,#0d1f12 40%,#0a1a2e 100%)}
.gk-shell > *:not(.wave-container){position:relative;z-index:1}

/* ── LAPTOP LAYOUT ── */
#game-menu,#dc-lb-panel{max-width:720px;margin:0 auto}
#dc-game-area{max-width:1000px;margin:0 auto}
/* question: larger than the answer boxes */
#dc-question-box{font-size:24px!important;line-height:1.55!important;padding:30px 34px!important;min-height:150px;display:flex;align-items:center;margin-bottom:18px!important;border-radius:18px!important}
/* options: 2 x 2 grid */
#dc-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#dc-opts button{margin-bottom:0!important;font-size:16px!important;padding:16px 18px!important;min-height:72px;border-radius:14px!important}
#dc-opts .dc-letter{width:34px!important;height:34px!important;font-size:14px!important}
#dc-timer-ring{width:70px!important;height:70px!important;font-size:26px!important}
@media(max-width:640px){
  .gk-shell{padding:12px 14px}
  #dc-question-box{font-size:16px!important;padding:16px!important;min-height:0}
  #dc-opts{grid-template-columns:1fr}
  #dc-opts button{font-size:13px!important;min-height:0;padding:12px 14px!important}
}

/* ── FULL SCREEN OVERRIDES ── */
#dc-game-area{max-width:none!important;margin:0!important;padding:0 1vw}
#dc-game-area:has(#dc-tab-review){max-width:900px!important;margin:0 auto!important}
#game-menu,#dc-lb-panel{max-width:820px;margin:0 auto}
#dc-timer-ring{width:76px!important;height:76px!important;font-size:28px!important;border-width:4px!important}
#dc-prog-label{font-size:clamp(16px,1.5vw,22px)!important}
.gk-ghost{position:fixed;bottom:14px;width:34px;height:34px;border-radius:50%;background:transparent;border:none;color:rgba(255,255,255,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:20;transition:color .2s}
.gk-ghost:hover{color:rgba(255,255,255,.65)}
#dc-question-box{font-size:clamp(24px,2.7vw,40px)!important;min-height:24vh;padding:clamp(28px,3.5vw,52px)!important;margin-bottom:clamp(28px,5vh,56px)!important}
#dc-opts{gap:clamp(16px,2.6vh,26px) clamp(16px,2vw,28px)}
#dc-opts button{font-size:clamp(17px,1.7vw,26px)!important;min-height:clamp(76px,12vh,120px);padding:18px 24px!important}
#dc-opts .dc-letter{width:44px!important;height:44px!important;font-size:18px!important}
@media(max-width:640px){
  #dc-timer-ring{width:60px!important;height:60px!important;font-size:22px!important}
  #dc-question-box{min-height:0;margin-bottom:16px!important}
  #dc-opts button{min-height:0;padding:12px 14px!important}
  #dc-opts .dc-letter{width:30px!important;height:30px!important;font-size:12px!important}
}
</style>

<script>
/* ============================================================
   DAILY CHALLENGE GAME
   ============================================================ */
var DC_SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSvboPbqXSBqbMR5UilxgOyrLvrSsxHl45mTxw6DH8DDnK1sRw_X9qIcke2Wi6zSgX4bv0gyA1hmyE-/pub?gid=0&single=true&output=csv';
var S2_URL=DC_SHEET_URL; // S2 — Daily Challenge quiz questions
var DC_STORE_KEY='dn-dc-v1';
var DC_LB_KEY='dn-dc-lb-v1';
var dcQuestions=[],dcSession={q:[],idx:0,score:0,xp:0,answers:[],startTime:0},dcTimer=null,dcTimeLeft=30;

/* ── SOUND ENGINE ── */
var dcAudioCtx=null;
var dcSoundOn=true; // default ON

function getDCAudio(){
  if(!dcAudioCtx){
    try{dcAudioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  if(dcAudioCtx&&dcAudioCtx.state==='suspended') dcAudioCtx.resume();
  return dcAudioCtx;
}

function toggleDCSound(){
  dcSoundOn=!dcSoundOn;
  var btn=document.getElementById('dc-sound-btn');
  if(!btn) return;
  if(dcSoundOn){
    btn.innerHTML=svgMicOn();
    btn.title='Sound ON';
    btn.style.color='#22c55e';
    btn.style.borderColor='rgba(34,197,94,.4)';
  } else {
    btn.innerHTML=svgMicOff();
    btn.title='Sound OFF';
    btn.style.color='rgba(255,255,255,.3)';
    btn.style.borderColor='rgba(255,255,255,.1)';
  }
  if(dcSoundOn) playDCSound('click');
}

function svgMicOn(){

function playDCSound(type){
  if(!dcSoundOn) return;
  var ctx=getDCAudio();if(!ctx)return;
  var t=ctx.currentTime;

  function note(freq,startT,dur,vol,waveType,detune){
    var o=ctx.createOscillator(),g=ctx.createGain();
    if(detune) o.detune.setValueAtTime(detune,startT);
    o.type=waveType||'sine';
    o.frequency.setValueAtTime(freq,startT);
    g.gain.setValueAtTime(0,startT);
    g.gain.linearRampToValueAtTime(vol,startT+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,startT+dur);
    o.connect(g);g.connect(ctx.destination);
    o.start(startT);o.stop(startT+dur);
  }

  if(type==='click'){
    note(900,t,0.06,0.18,'sine');
    return;
  }

  if(type==='correct'){
    /* Bright xylophone-style chord: root + fifth + octave, layered */
    note(523,t,0.35,0.55,'triangle');       // C5
    note(659,t+0.04,0.3,0.45,'triangle');   // E5
    note(784,t+0.08,0.28,0.4,'triangle');   // G5
    note(1047,t+0.14,0.35,0.5,'sine');      // C6 shine
    /* Subtle sparkle harmonics */
    note(1568,t+0.1,0.2,0.2,'sine');        // G6
    note(2093,t+0.18,0.15,0.15,'sine');     // C7
    return;
  }

  if(type==='wrong'){
    /* Heavy buzzer: square wave dropping pitch + low thud */
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(200,t);
    o.frequency.linearRampToValueAtTime(80,t+0.35);
    g.gain.setValueAtTime(0.55,t);
    g.gain.linearRampToValueAtTime(0.4,t+0.1);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g);g.connect(ctx.destination);
    o.start(t);o.stop(t+0.5);
    /* Low thud punch */
    note(60,t,0.25,0.6,'sine');
    note(110,t+0.05,0.2,0.35,'sawtooth');
    return;
  }

  if(type==='finish'){
    /* Victory fanfare: ascending 8-note arpeggio + final chord */
    var fanfare=[392,440,523,659,523,659,784,1047];
    fanfare.forEach(function(freq,i){
      note(freq, t+i*0.1, 0.22, 0.5, 'triangle');
    });
    /* Final chord hit */
    [523,659,784,1047].forEach(function(freq){
      note(freq, t+0.85, 0.6, 0.45, 'sine');
    });
    return;
  }

  if(type==='entry'){
    /* Cool entry music: 12-step epic rising sequence with harmony */
    var melody=[261,294,330,349,392,440,494,523,587,659,784,1047];
    var harmony=[196,220,247,261,294,330,370,392,440,494,587,784];
    melody.forEach(function(freq,i){
      note(freq,  t+i*0.07, 0.18, 0.45, 'triangle');
      note(harmony[i], t+i*0.07, 0.18, 0.25, 'sine');
    });
    /* Big finale chord */
    [523,659,784,1047,1318].forEach(function(freq,i){
      note(freq, t+0.88, 0.8, 0.4-i*0.04, 'sine');
    });
    return;
  }
}

function getLBKey(){return DC_LB_KEY;}
function getLB(){try{return JSON.parse(localStorage.getItem(getLBKey())||'[]');}catch(e){return[];}}
function saveLB(lb){localStorage.setItem(getLBKey(),JSON.stringify(lb));}
function updateLB(name,score){
  var lb=getLB();
  var existing=lb.findIndex(function(e){return e.name===name;});
  if(existing>=0){
    lb[existing].total=(lb[existing].total||lb[existing].best||0)+Math.max(0,score);
    if(score>lb[existing].best) lb[existing].best=score;
    lb[existing].last=score;
    lb[existing].plays=(lb[existing].plays||1)+1;
  } else {
    lb.push({name:name,total:Math.max(0,score),best:score,last:score,plays:1});
  }
  lb.sort(function(a,b){return (b.total||b.best||0)-(a.total||a.best||0);});
  lb=lb.slice(0,50);
  saveLB(lb);
  var entry=lb[lb.findIndex(function(e){return e.name===name;})];
  pushLBToServer(name,score,entry.best,entry.plays,entry.total);
  return lb;
}
function pushLBToServer(name,score,best,plays,total){
  try{
    var key = name.replace(/[.#$\/\[\]]/g,'_');
    LB_REF.child(key).transaction(function(current){
      var addPoints=Math.max(0,score);
      if(!current){
        return {name:name, best:best, score:score, total:addPoints, plays:1, updatedAt:Date.now()};
      }
      return {
        name: name,
        best: Math.max(current.best||0, best),
        score: score,
        total: (current.total||current.best||0) + addPoints,
        plays: (current.plays||0) + 1,
        updatedAt: Date.now()
      };
    });
  }catch(e){ console.log('Firebase push error:', e); }
}
function fetchServerLB(){
  return new Promise(function(resolve){
    LB_REF.orderByChild('total').limitToLast(50).once('value')
      .then(function(snapshot){
        var data=snapshot.val();
        if(!data){ resolve(getLB()); return; }
        var arr=Object.values(data);
        arr.sort(function(a,b){return (b.total||b.best||0)-(a.total||a.best||0);});
        saveLB(arr);
        resolve(arr);
      })
      .catch(function(){ resolve(getLB()); });
  });
}

// Realtime listener — auto refresh leaderboard when anyone plays
function startLBRealtime(){
  LB_REF.orderByChild('total').limitToLast(50).on('value', function(snapshot){
    var data=snapshot.val();
    if(!data) return;
    var arr=Object.values(data);
    arr.sort(function(a,b){return (b.total||b.best||0)-(a.total||a.best||0);});
    saveLB(arr);
    // If leaderboard panel is open, refresh it live
    var panel=document.getElementById('dc-lb-panel');
    var cont=document.getElementById('dc-lb-content');
    if(panel&&panel.style.display!=='none'&&cont){

}

function getDCStreak(){
  var s=getDCStore();
  var now=new Date();var utc=now.getTime()+(now.getTimezoneOffset()*60000);var np=new Date(utc+(5*3600+45*60)*1000);
  var today=np.toDateString();
  var yesterday=new Date(np);yesterday.setDate(np.getDate()-1);
  var streak=s.streak||0;
  if(s.lastPlayed===today) return streak;
  if(s.lastPlayed===yesterday.toDateString()) return streak; // Not reset yet, will increment on play
  if(s.lastPlayed&&s.lastPlayed!==yesterday.toDateString()&&s.lastPlayed!==today) return 0; // Missed a day
  return streak;
}

function fetchDCSheet(){
  function parseToRows(csv){
    var lines=csv.trim().split('\n');
    var rows=[];
    for(var i=1;i<lines.length;i++){
      var cols=parseCSVLine(lines[i]);
      if(cols.length>=6&&cols[0].trim()){
        rows.push({q:cols[0].trim(),o:[cols[1].trim(),cols[2].trim(),cols[3].trim(),cols[4].trim()],a:cols[5].trim()});
      }
    }
    return rows;
  }
  return fetch(DC_SHEET_URL)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(csv){return parseToRows(csv);})
    .catch(function(){
      return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(DC_SHEET_URL))
        .then(function(r){return r.text();})
        .then(function(csv){return parseToRows(csv);})
        .catch(function(){
          return fetch('https://corsproxy.io/?'+encodeURIComponent(DC_SHEET_URL))
            .then(function(r){return r.text();})
            .then(function(csv){return parseToRows(csv);});
        });
    });
}

function parseCSVLine(line){
  var result=[],inQ=false,cur='';
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);
  return result;
}

    if(el) el.textContent=dcTimeLeft;
    if(ring){
      if(dcTimeLeft<=10){ring.style.borderColor='#ef4444';ring.style.color='#ef4444';ring.style.background='rgba(239,68,68,.1)';}
      else if(dcTimeLeft<=20){ring.style.borderColor='#f59e0b';ring.style.color='#f59e0b';ring.style.background='rgba(245,158,11,.08)';}
    }
    if(dcTimeLeft<=0){
      clearInterval(dcTimer);
      playDCSound('wrong');
      dcSession.score-=2;
      dcSession.answers.push({q:dcSession.q[dcSession.idx].q,chosen:'(Time Out)',correct:correctText,ok:false,bonus:0});
      dcTimeoutReveal(correctText);
    }
  },1000);
}

function escQ(s){return (s||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;');}

function dcAnswer(btn,chosen,correct){
  clearInterval(dcTimer);
  var ok=(chosen.toLowerCase().trim()===correct.toLowerCase().trim());
  // Fast answer bonus: <5s = +4 pts, <10s = +2 pts, else standard
  var elapsed=(Date.now()-dcSession.startTime)/1000;
  var timeSpent=30-dcTimeLeft;
  var bonus=0;
  if(ok){
    if(timeSpent<5) bonus=4;
    else if(timeSpent<10) bonus=2;
    dcSession.score+=2+bonus;
    dcSession.xp+=10+(bonus>0?5:0);
    playDCSound('correct');
    // Green flash on question box
    var qbox=document.getElementById('dc-question-box');
    if(qbox) qbox.classList.add('dc-flash-green');
  } else {
    dcSession.score-=2;
    playDCSound('wrong');
    // Red shake on wrong button
    btn.classList.add('dc-shake');
  }
  dcSession.answers.push({q:dcSession.q[dcSession.idx].q,chosen:chosen,correct:correct,ok:ok,bonus:bonus});

  // Highlight buttons
  var opts=document.getElementById('dc-opts');
  if(opts) opts.querySelectorAll('button').forEach(function(b){
    var dataVal=b.getAttribute('data-val')||'';
    b.disabled=true;b.style.cursor='default';
    if(dataVal.toLowerCase().trim()===correct.toLowerCase().trim()){
      b.style.background='#16a34a';b.style.borderColor='#22c55e';b.style.color='#fff';
      b.querySelector('.dc-letter').style.background='rgba(255,255,255,.25)';
      b.querySelector('.dc-letter').style.color='#fff';
    } else if(b===btn&&!ok){
      b.style.background='#dc2626';b.style.borderColor='#ef4444';b.style.color='#fff';
      b.querySelector('.dc-letter').style.background='rgba(255,255,255,.25)';
      b.querySelector('.dc-letter').style.color='#fff';
    }
  });

  // Show bonus toast
  if(bonus>0){
    var area=document.getElementById('dc-game-area');
    var toast=document.createElement('div');
    toast.textContent='+'+bonus+' Speed Bonus!';
    toast.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#fff;font-size:12px;font-weight:800;padding:6px 16px;border-radius:99px;z-index:999;pointer-events:none';
    document.body.appendChild(toast);
    setTimeout(function(){toast.remove();},1200);
  }

  // Update score in UI
  var scoreEl=document.querySelector('#dc-game-area [style*="pts"]');
  if(scoreEl) scoreEl.textContent=dcSession.score+' pts';

  setTimeout(function(){dcNext();},ok?750:1000);
}

function dcTimeoutReveal(correct){
  var opts=document.getElementById('dc-opts');
  if(opts) opts.querySelectorAll('button').forEach(function(b){
    var dataVal=b.getAttribute('data-val')||'';
    b.disabled=true;b.style.cursor='default';
    if(dataVal.toLowerCase().trim()===correct.toLowerCase().trim()){
      b.style.background='#16a34a';b.style.borderColor='#22c55e';b.style.color='#fff';
      var dl=b.querySelector('.dc-letter');
      if(dl){dl.style.background='rgba(255,255,255,.25)';dl.style.color='#fff';}
    }
  });
  setTimeout(function(){dcNext();},900);
}

function dcNext(){
  dcSession.idx++;
  if(dcSession.idx>=dcSession.q.length){dcShowResult();}
  else{renderDCQuestion();}
}

function dcQuit(){
  clearInterval(dcTimer);
  document.getElementById('dc-game-area').style.display='none';
  document.getElementById('game-menu').style.display='block';
}

function dcShowResult(){
  clearInterval(dcTimer);
  playDCSound('finish');

  // ── Streak & store update ──
  var store=getDCStore();
  var now=new Date();var utc=now.getTime()+(now.getTimezoneOffset()*60000);var np=new Date(utc+(5*3600+45*60)*1000);
  var today=np.toDateString();
  var yesterday=new Date(np);yesterday.setDate(np.getDate()-1);
  var streak=store.streak||0;
  if(store.lastPlayed===yesterday.toDateString()) streak+=1;
  else if(store.lastPlayed===today) streak=streak;
  else streak=1;
  var totalPoints=(store.totalPoints||0)+Math.max(0,dcSession.score);
  var totalXP=(store.totalXP||0)+dcSession.xp;
  saveDCStore({streak:streak,lastPlayed:today,totalPoints:totalPoints,bestScore:Math.max(store.bestScore||0,dcSession.score),totalXP:totalXP});

  // Save LB
  var lbName=getPlayerName()||'Guest';
  updateLB(lbName,dcSession.score);
  updateDCBadges();

  var lvl=getDCLevel(totalXP);
  var correct=dcSession.answers.filter(function(a){return a.ok;}).length;
  var wrong=dcSession.answers.filter(function(a){return !a.ok;}).length;
  var bonusTotal=dcSession.answers.reduce(function(s,a){return s+(a.bonus||0);},0);
  var area=document.getElementById('dc-game-area');

  // Trophy SVG based on score
  var trophySVG=dcSession.score>=20
    ?'<svg width="44" height="44" viewBox="0 0 24 24" fill="#f59e0b" stroke="#d97706" stroke-width="1"><path d="M8 21h8M12 17v4M7 4h10l1 7a5 5 0 0 1-10 0z"/><path d="M5 4h2M17 4h2M5 4c0 2 1 3 2 4M19 4c0 2-1 3-2 4"/></svg>'
    :dcSession.score>=10
    ?'<svg width="44" height="44" viewBox="0 0 24 24" fill="#f59e0b" stroke="#d97706" stroke-width="1"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'
    :'<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-linecap="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>';

  var svgCheck='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var svgX2='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  var svgFire='<svg width="12" height="12" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><path d="M12 2c0 4-4 6-4 10a4 4 0 0 0 8 0c0-4-4-6-4-10z"/><path d="M12 14c0 1.5-1 2.5-1 4a1 1 0 0 0 2 0c0-1.5-1-2.5-1-4z" fill="#fff"/></svg>';
  var svgStar='<svg width="11" height="11" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
  var svgBolt='<svg width="11" height="11" viewBox="0 0 24 24" fill="#f59e0b" stroke="none"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>';
  var svgBack='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
  var svgPlay='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>';

  // Come-back message
  var comeBack=streak>0?'Return tomorrow to keep your '+streak+'-day streak alive!':'Play daily to build your streak!';

  area.innerHTML=
    '<div style="padding:14px">'
    // Result card
    +'<div style="background:linear-gradient(135deg,#0a0a1a,#0d1f12);border:1px solid rgba(34,197,94,.25);border-radius:18px;padding:20px;text-align:center;margin-bottom:12px;box-shadow:0 0 40px rgba(34,197,94,.1)">'
    +'<div style="margin-bottom:10px">'+trophySVG+'</div>'
    +'<div style="font-size:28px;font-weight:900;color:#fff;margin-bottom:2px">'+dcSession.score+' pts</div>'
    +'<div style="font-size:11px;color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;gap:10px">'
    +'<span style="display:flex;align-items:center;gap:3px">'+svgCheck+' '+correct+' correct</span>'
    +'<span style="display:flex;align-items:center;gap:3px">'+svgX2+' '+wrong+' wrong</span>'
    +(bonusTotal>0?'<span style="display:flex;align-items:center;gap:3px">'+svgBolt+' +'+bonusTotal+' bonus</span>':'')
    +'</div>'
    +'<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px">'
    +'<span style="font-size:10px;background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3);padding:4px 10px;border-radius:99px;font-weight:700;display:flex;align-items:center;gap:4px">'+svgFire+' '+streak+' Day Streak</span>'
    +'<span style="font-size:10px;background:rgba(255,255,255,.08);color:'+lvl.color+';border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;font-weight:700">'+lvl.name+'</span>'
    +'<span style="font-size:10px;background:rgba(255,255,255,.08);color:#86efac;border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;font-weight:700;display:flex;align-items:center;gap:4px">'+svgStar+' '+totalXP+' XP</span>'
    +'</div>'
    +'<div style="margin-top:10px;font-size:10px;color:rgba(255,255,255,.4);font-style:italic">'+comeBack+'</div>'
    +'</div>'
    // Tabs
    +'<div style="display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;margin-bottom:12px">'
    +'<button id="dc-tab-review" data-tab="review" style="flex:1;padding:8px;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.1);color:#fff">Review</button>'
    +'<button id="dc-tab-lb" data-tab="lb" style="flex:1;padding:8px;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:rgba(255,255,255,.5)">Leaderboard</button>'
    +'</div>'
    // Review panel
    +'<div id="dc-panel-review">'
    +dcSession.answers.map(function(a,i){
      var border=a.ok?'#22c55e':'#ef4444';
      var svgOk=a.ok
        ?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>'
        :'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      return '<div style="margin-bottom:8px;padding:11px 12px;background:rgba(255,255,255,.04);border:1.5px solid '+border+';border-radius:10px">'
        +'<div style="font-size:11px;font-weight:700;color:#fff;margin-bottom:5px;line-height:1.5;display:flex;align-items:flex-start;gap:6px">'+svgOk+'<span>'+(i+1)+'. '+a.q+'</span></div>'
        +'<div style="font-size:11px;color:'+(a.ok?'#86efac':'#fca5a5')+';font-weight:600">'+(a.ok?'Correct: ':'Your answer: ')+a.chosen+'</div>'
        +(!a.ok?'<div style="font-size:11px;color:#86efac;margin-top:3px;font-weight:600">Correct: '+a.correct+'</div>':'')
        +(a.bonus>0?'<div style="font-size:10px;color:#fbbf24;margin-top:2px">+'+a.bonus+' speed bonus</div>':'')
        +'</div>';
    }).join('')
    +'</div>'
    // LB panel
    +'<div id="dc-panel-lb" style="display:none"><div id="dc-result-lb-inner">'+renderLBHTML()+'</div></div>'
    // Buttons
    +'<div style="display:flex;gap:8px;margin-top:14px">'
    +'<button onclick="startDailyChallenge()" style="flex:1;padding:12px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">'+svgPlay+' Play Again</button>'
    +'<button onclick="dcQuit()" style="flex:1;padding:12px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.15);border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">'+svgBack+' Back</button>'
    +'</div></div>';

  // Attach tab listeners
  setTimeout(function(){
    var btnR=document.getElementById('dc-tab-review');
    var btnL=document.getElementById('dc-tab-lb');
    if(btnR) btnR.addEventListener('click',function(){dcSwitchTab('review');});
    if(btnL) btnL.addEventListener('click',function(){dcSwitchTab('lb');});
  },0);
}

function dcSwitchTab(tab){
  var rev=document.getElementById('dc-panel-review');
  var lb=document.getElementById('dc-panel-lb');
  var tbR=document.getElementById('dc-tab-review');
  var tbL=document.getElementById('dc-tab-lb');
  if(tab==='review'){
    rev.style.display='block';lb.style.display='none';
    tbR.style.background='rgba(255,255,255,.1)';tbR.style.color='#fff';
    tbL.style.background='transparent';tbL.style.color='rgba(255,255,255,.5)';
  } else {
    rev.style.display='none';lb.style.display='block';
    tbL.style.background='rgba(255,255,255,.1)';tbL.style.color='#fff';
    tbR.style.background='transparent';tbR.style.color='rgba(255,255,255,.5)';
    var inner=document.getElementById('dc-result-lb-inner');
    if(inner){
      inner.innerHTML='<div style="text-align:center;padding:16px;font-size:12px;color:rgba(255,255,255,.5)">Loading...</div>';
      fetchServerLB().then(function(){if(inner)inner.innerHTML=renderLBHTML();});
    }
  }
}

/* Update streak/level badges on init */
updateDCBadges();


/* ── PLAYER NAME (standalone replacement for the main app's login) ── */
var GK_NAME_KEY='gk-player-name', gkAfterName=null;
function getPlayerName(){
  var n=(localStorage.getItem(GK_NAME_KEY)||'').trim(); if(n) return n;
  try{var s=JSON.parse(localStorage.getItem('dn-session-v3')||'null'); if(s) return (s.name||s.email||'').trim();}catch(e){}
  return '';
}
function updatePlayerChip(){
  var el=document.getElementById('gk-player-name'); if(el) el.textContent=getPlayerName()||'Guest';
}
function openNameModal(after){
  gkAfterName=after||null;
  var m=document.getElementById('gk-name-modal'),i=document.getElementById('gk-name-input');
  i.value=getPlayerName(); m.style.display='flex'; setTimeout(function(){i.focus();},50);
}
function closeNameModal(){ document.getElementById('gk-name-modal').style.display='none'; gkAfterName=null; }
function saveNameModal(){
  var v=document.getElementById('gk-name-input').value.replace(/[<>&"'\\\/]/g,'').trim().slice(0,24);
  if(!v){ document.getElementById('gk-name-input').focus(); return; }
  localStorage.setItem(GK_NAME_KEY,v); updatePlayerChip();
  var cb=gkAfterName; closeNameModal(); if(cb) cb();
}
updatePlayerChip();
try{ startLBRealtime(); }catch(e){}
